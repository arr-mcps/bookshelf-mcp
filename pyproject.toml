[project]
name = "bookshelf-mcp"
version = "0.1.0"
description = "MCP server for Bookshelf's v1 API (Readarr fork)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
bookshelf-mcp = "bookshelf_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Bookshelf instance (needs BOOKSHELF_URL/BOOKSHELF_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
